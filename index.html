<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>SNS HUB</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#f3f4f6;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}h2{font-size:18px;margin:18px 0 12px}.muted,small{color:#a5adbd}main{padding:0 16px;max-width:780px;margin:auto}.card{background:#182137;border:1px solid #29344c;border-radius:16px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center}.stat strong{display:block;font-size:24px;margin-top:7px}.btn,button{background:#6677ee;border:0;color:white;border-radius:10px;padding:11px 14px;font-weight:650;cursor:pointer}.secondary{background:#303b54}.danger{background:#873b4a}.tiny{padding:7px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:flex;flex-direction:column;gap:8px}.pill{font-size:11px;background:#344363;padding:5px 8px;border-radius:20px;white-space:nowrap}.tabs{position:fixed;bottom:0;left:0;right:0;background:#121b2e;border-top:1px solid #35405a;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}.tabs button{background:transparent;color:#a5adbd;padding:7px 5px;font-size:11px;min-width:60px}.tabs button.active{color:#fff;background:#33416a}.hidden{display:none!important}input,select,textarea{width:100%;padding:12px;border:1px solid #43516c;border-radius:10px;background:#0f172a;color:white;font:inherit}label{font-size:13px;display:block;margin:10px 0 5px;color:#c4ccda}textarea{min-height:90px}dialog{background:#182137;color:white;border:1px solid #43516c;border-radius:16px;width:calc(100% - 28px);max-width:520px;max-height:88vh;overflow:auto}dialog::backdrop{background:#000b}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.taskdone{opacity:.55}.taskdone .tasktitle{text-decoration:line-through}.check{width:22px;height:22px;accent-color:#7785f8}.topgap{margin-top:12px}.empty{text-align:center;padding:30px 12px;color:#a5adbd}nav{max-width:780px;margin:auto}.wide{width:100%}.notice{font-size:12px;line-height:1.5;color:#b4c0d4}a{color:#a7b9ff}.tag{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}#toast{position:fixed;bottom:90px;left:20px;right:20px;background:#334467;padding:12px;border-radius:12px;text-align:center;display:none;z-index:30}
</style></head><body><header><div><h1>SNS HUB</h1><small id="today"></small></div><button class="secondary tiny" onclick="openSettings()">⚙ 設定</button></header><main><section id="home"></section><section id="schedule" class="hidden"></section><section id="posts" class="hidden"></section><section id="analytics" class="hidden"></section><section id="money" class="hidden"></section></main><nav class="tabs" id="tabs"><button data-tab="home" class="active">⌂<br>ホーム</button><button data-tab="schedule">▦<br>予定</button><button data-tab="posts">✎<br>投稿</button><button data-tab="analytics">▥<br>分析</button><button data-tab="money">¥<br>収益</button></nav><dialog id="modal"><div id="modalbody"></div></dialog><div id="toast"></div><script>
const KEY='snshub-v1';const defaults={accounts:[{id:'a1',name:'ラクノバ',platform:'Threads・楽天ROOM',color:'#60a5fa'},{id:'a2',name:'よし',platform:'Threads・楽天アフィリエイト',color:'#34d399'},{id:'a3',name:'NOVELCA',platform:'Threads・note',color:'#a78bfa'},{id:'a4',name:'からだ日和50＋',platform:'Threads・Amazon',color:'#fbbf24'},{id:'a5',name:'NEXARIA',platform:'Threads・X・Instagram・YouTube',color:'#f472b6'}],tasks:[],posts:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};db.accounts||=[];db.tasks||=[];db.posts||=[];let active='home',day=new Date().toLocaleDateString('sv-SE');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('保存できませんでした。空き容量を確認し、バックアップしてください。')}};const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});const account=id=>db.accounts.find(a=>a.id===id);const accountName=id=>account(id)?.name||'削除済み';const options=(selected='')=>db.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('');function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function show(tab){active=tab;document.querySelectorAll('main section').forEach(e=>e.classList.toggle('hidden',e.id!==tab));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));render()}document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>show(e.dataset.tab));function openModal(html){$('modalbody').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function render(){ $('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const todayTasks=db.tasks.filter(t=>t.date===day);const completed=todayTasks.filter(t=>t.status==='done').length;const pending=todayTasks.filter(t=>t.status==='pending').length;$('home').innerHTML=`<div class="grid"><div class="card stat"><small>アカウント</small><strong>${db.accounts.length}</strong></div><div class="card stat"><small>今日の予定</small><strong>${todayTasks.length}</strong></div><div class="card stat"><small>未完了</small><strong>${pending}</strong></div></div><div class="row"><h2>今日のタスク</h2><button class="tiny" onclick="taskForm()">＋追加</button></div>${taskList(todayTasks)}<h2>アカウント</h2>${db.accounts.map(a=>`<div class="card row"><div><strong><span class="tag" style="background:${esc(a.color)}"></span>${esc(a.name)}</strong><div><small>${esc(a.platform)}</small></div></div><button class="secondary tiny" onclick="accountForm('${a.id}')">編集</button></div>`).join('')}<button class="secondary wide" onclick="accountForm()">＋ アカウント追加</button><p class="notice">データはこの端末のブラウザ内に保存されます。設定から定期的にバックアップしてください。</p>`;$('schedule').innerHTML=`<div class="row"><h2>投稿・タスク予定</h2><button class="tiny" onclick="taskForm()">＋追加</button></div><label>表示する日付</label><input type="date" value="${day}" onchange="day=this.value;render()"><div class="topgap">${taskList(db.tasks.filter(t=>t.date===day))}</div><h2>今後の予定</h2>${taskList(db.tasks.filter(t=>t.date>day).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,30),true)}`;$('posts').innerHTML=`<div class="row"><h2>投稿ストック</h2><button class="tiny" onclick="postForm()">＋追加</button></div>${db.posts.length?db.posts.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(p=>`<div class="card"><div class="row"><strong>${esc(p.title||'無題')}</strong><span class="pill">${esc(p.status)}</span></div><small>${esc(accountName(p.account))} ・ ${esc(p.platform||'')}</small><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.body)}</p><div class="actions"><button class="tiny secondary" onclick="copyPost('${p.id}')">コピー</button><button class="tiny secondary" onclick="postForm('${p.id}')">編集</button><button class="tiny danger" onclick="removePost('${p.id}')">削除</button></div></div>`).join(''):'<div class="card empty">投稿を保存するとここに表示されます</div>'}`;$('analytics').innerHTML=`<h2>分析（第2段階で拡張）</h2><div class="card"><strong>タスク実行率</strong><h1>${todayTasks.length?Math.round(completed/todayTasks.length*100):0}%</h1><small>今日の完了 ${completed} / 全 ${todayTasks.length} 件</small></div><div class="card"><strong>投稿ストック</strong><h1>${db.posts.length} 件</h1><small>下書き・投稿予定・投稿済み</small></div><p class="notice">表示回数・いいね・クリック等の記録とグラフは第2段階で実装予定です。</p>`;$('money').innerHTML='<h2>収益管理（第3段階）</h2><div class="card"><p>楽天・Amazon・noteなどの収益を記録する画面を追加予定です。</p><small>このバージョンでは収益の入力・保存機能はありません。</small></div>'}function taskList(tasks,dates=false){if(!tasks.length)return '<div class="card empty">予定はありません</div>';return tasks.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(t=>`<div class="card ${t.status==='done'?'taskdone':''}"><div class="row"><input class="check" type="checkbox" aria-label="完了" style="flex:none" ${t.status==='done'?'checked':''} onchange="setStatus('${t.id}',this.checked?'done':'pending')"><div style="flex:1;min-width:0"><div class="tasktitle"><strong>${esc(t.title)}</strong></div><small>${dates?esc(fmt(t.date))+' ・ ':''}${esc(t.time||'時刻なし')} ・ ${esc(accountName(t.account))}</small></div><span class="pill">${({pending:'未完了',done:'完了',skip:'見送り'})[t.status]||'未完了'}</span></div><div class="actions"><button class="tiny secondary" onclick="taskForm('${t.id}')">編集・振替</button><button class="tiny secondary" onclick="setStatus('${t.id}','skip')">見送り</button><button class="tiny danger" onclick="removeTask('${t.id}')">削除</button></div></div>`).join('')}function setStatus(id,status){let t=db.tasks.find(x=>x.id===id);if(t){t.status=status;save();render()}}function taskForm(id){let t=db.tasks.find(x=>x.id===id)||{title:'',account:db.accounts[0]?.id,date:day,time:'20:00',status:'pending',notes:''};if(!db.accounts.length)return toast('先にアカウントを登録してください');openModal(`<h2>${id?'タスク編集':'タスク追加'}</h2><form id="taskform"><label>タスク名</label><input name="title" required maxlength="120" value="${esc(t.title)}"><label>アカウント</label><select name="account">${options(t.account)}</select><label>日付</label><input name="date" type="date" required value="${esc(t.date)}"><label>時刻</label><input name="time" type="time" value="${esc(t.time)}"><label>状態</label><select name="status">${[['pending','未完了'],['done','完了'],['skip','見送り']].map(([v,n])=>`<option value="${v}" ${t.status===v?'selected':''}>${n}</option>`).join('')}</select><label>メモ</label><textarea name="notes">${esc(t.notes||'')}</textarea><div class="actions"><button type="submit">保存</button><button type="button" class="secondary" onclick="closeModal()">キャンセル</button></div></form>`);$('taskform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries());if(id)Object.assign(t,data);else db.tasks.push({id:uid(),...data});save();closeModal();render();toast('保存しました')}}function removeTask(id){if(confirm('このタスクを削除しますか？')){db.tasks=db.tasks.filter(t=>t.id!==id);save();render()}}function accountForm(id){let a=account(id)||{name:'',platform:'Threads',color:'#6677ee'};openModal(`<h2>${id?'アカウント編集':'アカウント追加'}</h2><form id="accountform"><label>アカウント名</label><input name="name" maxlength="60" required value="${esc(a.name)}"><label>管理するSNS</label><input name="platform" maxlength="160" value="${esc(a.platform)}"><label>テーマカラー</label><input name="color" type="color" value="${esc(a.color)}"><div class="actions"><button>保存</button><button type="button" class="secondary" onclick="closeModal()">キャンセル</button>${id?`<button type="button" class="danger" onclick="removeAccount('${id}')">削除</button>`:''}</div></form>`);$('accountform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(id)Object.assign(a,data);else db.accounts.push({id:uid(),...data});save();closeModal();render()}}function removeAccount(id){if(!confirm('アカウントを削除しますか？関連タスク・投稿は残りますが「削除済み」と表示されます。'))return;db.accounts=db.accounts.filter(a=>a.id!==id);save();closeModal();render()}function postForm(id){let p=db.posts.find(x=>x.id===id)||{account:db.accounts[0]?.id,title:'',platform:'Threads',status:'下書き',body:'',created:new Date().toISOString()};if(!db.accounts.length)return toast('先にアカウントを登録してください');openModal(`<h2>${id?'投稿編集':'投稿追加'}</h2><form id="postform"><label>タイトル</label><input name="title" maxlength="120" required value="${esc(p.title)}"><label>アカウント</label><select name="account">${options(p.account)}</select><label>SNS</label><input name="platform" value="${esc(p.platform)}"><label>状態</label><select name="status">${['アイデア','下書き','投稿予定','投稿済み'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select><label>投稿本文</label><textarea name="body" rows="8">${esc(p.body)}</textarea><div class="actions"><button>保存</button><button type="button" class="secondary" onclick="closeModal()">キャンセル</button></div></form>`);$('postform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(id)Object.assign(p,data);else db.posts.push({id:uid(),created:new Date().toISOString(),...data});save();closeModal();render()}}function removePost(id){if(confirm('この投稿を削除しますか？')){db.posts=db.posts.filter(p=>p.id!==id);save();render()}}async function copyPost(id){let p=db.posts.find(x=>x.id===id);try{await navigator.clipboard.writeText(p.body);toast('本文をコピーしました')}catch{toast('コピーできませんでした。本文を選択してください')}}function downloadBackup(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sns-hub-backup-'+day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function openSettings(){openModal(`<h2>設定・バックアップ</h2><p class="notice">このアプリはログイン不要・端末内保存です。Safariのデータ削除などで消える場合があります。</p><div class="stack"><button onclick="downloadBackup()">バックアップを書き出す（JSON）</button><label>バックアップを復元（現在のデータは置き換え）</label><input id="restore" type="file" accept="application/json,.json"><button class="secondary" onclick="restoreBackup()">復元する</button><button class="secondary" onclick="closeModal()">閉じる</button></div>`)}async function restoreBackup(){let file=$('restore').files[0];if(!file)return toast('ファイルを選択してください');try{let obj=JSON.parse(await file.text()),d=obj.data;if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.tasks)||!Array.isArray(d.posts))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容に置き換えますか？'))return;db=d;save();closeModal();render();toast('復元しました')}catch{alert('対応していないバックアップ形式です')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
