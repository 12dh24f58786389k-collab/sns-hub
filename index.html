<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>SNS HUB v2.1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#f3f4f6;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}h2{font-size:18px;margin:18px 0 12px}.muted,small{color:#a5adbd}main{padding:0 16px;max-width:780px;margin:auto}.card{background:#182137;border:1px solid #29344c;border-radius:16px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center}.stat strong{display:block;font-size:24px;margin-top:7px}.btn,button{background:#6677ee;border:0;color:white;border-radius:10px;padding:11px 14px;font-weight:650;cursor:pointer}.secondary{background:#303b54}.danger{background:#873b4a}.tiny{padding:7px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:flex;flex-direction:column;gap:8px}.pill{font-size:11px;background:#344363;padding:5px 8px;border-radius:20px;white-space:nowrap}.tabs{position:fixed;bottom:0;left:0;right:0;background:#121b2e;border-top:1px solid #35405a;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}.tabs button{background:transparent;color:#a5adbd;padding:7px 5px;font-size:11px;min-width:60px}.tabs button.active{color:#fff;background:#33416a}.hidden{display:none!important}input,select,textarea{width:100%;padding:12px;border:1px solid #43516c;border-radius:10px;background:#0f172a;color:white;font:inherit}label{font-size:13px;display:block;margin:10px 0 5px;color:#c4ccda}textarea{min-height:90px}dialog{background:#182137;color:white;border:1px solid #43516c;border-radius:16px;width:calc(100% - 28px);max-width:520px;max-height:88vh;overflow:auto}dialog::backdrop{background:#000b}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.taskdone{opacity:.55}.taskdone .tasktitle{text-decoration:line-through}.check{width:22px;height:22px;accent-color:#7785f8}.topgap{margin-top:12px}.empty{text-align:center;padding:30px 12px;color:#a5adbd}nav{max-width:780px;margin:auto}.wide{width:100%}.notice{font-size:12px;line-height:1.5;color:#b4c0d4}a{color:#a7b9ff}.tag{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}#toast{position:fixed;bottom:90px;left:20px;right:20px;background:#334467;padding:12px;border-radius:12px;text-align:center;display:none;z-index:30}
 .filterbar{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px}.filterbar button{white-space:nowrap}.filterbar .chosen{background:#6677ee}.counter{display:flex;align-items:center;gap:9px}.counter strong{min-width:34px;text-align:center}.preview{white-space:pre-wrap;max-height:220px;overflow:auto;background:#0f172a;border-radius:9px;padding:10px;font-size:12px}.subtle{font-size:12px;color:#a5adbd} </style></head><body><header><div><h1>SNS HUB</h1><small id="today"></small></div><button class="secondary tiny" onclick="openSettings()">⚙ 設定</button></header><main><section id="home"></section><section id="schedule" class="hidden"></section><section id="posts" class="hidden"></section><section id="analytics" class="hidden"></section><section id="money" class="hidden"></section></main><nav class="tabs" id="tabs"><button data-tab="home" class="active">⌂<br>ホーム</button><button data-tab="schedule">▦<br>予定</button><button data-tab="posts">✎<br>投稿</button><button data-tab="analytics">▥<br>分析</button><button data-tab="money">¥<br>収益</button></nav><dialog id="modal"><div id="modalbody"></div></dialog><div id="toast"></div><script>
const KEY='snshub-v1';const defaults={accounts:[{id:'a1',name:'ラクノバ',platform:'Threads・楽天ROOM',color:'#60a5fa'},{id:'a2',name:'よし',platform:'Threads・楽天アフィリエイト',color:'#34d399'},{id:'a3',name:'NOVELCA',platform:'Threads・note',color:'#a78bfa'},{id:'a4',name:'からだ日和50＋',platform:'Threads・Amazon',color:'#fbbf24'},{id:'a5',name:'NEXARIA',platform:'Threads・X・Instagram・YouTube',color:'#f472b6'}],tasks:[],posts:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};db.accounts||=[];db.tasks||=[];db.posts||=[];let active='home',day=new Date().toLocaleDateString('sv-SE');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('保存できませんでした。空き容量を確認し、バックアップしてください。')}};const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});const account=id=>db.accounts.find(a=>a.id===id);const accountName=id=>account(id)?.name||'削除済み';const options=(selected='')=>db.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('');function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function show(tab){active=tab;document.querySelectorAll('main section').forEach(e=>e.classList.toggle('hidden',e.id!==tab));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));render()}document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>show(e.dataset.tab));function openModal(html){$('modalbody').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function render(){ $('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const todayTasks=db.tasks.filter(t=>t.date===day);const completed=todayTasks.filter(t=>t.status==='done').length;const pending=todayTasks.filter(t=>t.status==='pending').length;$('home').innerHTML=`<div class="grid"><div class="card stat"><small>アカウント</small><strong>${db.accounts.length}</strong></div><div class="card stat"><small>今日の予定</small><strong>${todayTasks.length}</strong></div><div class="card stat"><small>未完了</small><strong>${pending}</strong></div></div><div class="row"><h2>今日のタスク</h2><button class="tiny" onclick="taskForm()">＋追加</button></div>${taskList(todayTasks)}<h2>アカウント</h2>${db.accounts.map(a=>`<div class="card row"><div><strong><span class="tag" style="background:${esc(a.color)}"></span>${esc(a.name)}</strong><div><small>${esc(a.platform)}</small></div></div><button class="secondary tiny" onclick="accountForm('${a.id}')">編集</button></div>`).join('')}<button class="secondary wide" onclick="accountForm()">＋ アカウント追加</button><p class="notice">データはこの端末のブラウザ内に保存されます。設定から定期的にバックアップしてください。</p>`;$('schedule').innerHTML=`<div class="row"><h2>投稿・タスク予定</h2><button class="tiny" onclick="taskForm()">＋追加</button></div><label>表示する日付</label><input type="date" value="${day}" onchange="day=this.value;render()"><div class="topgap">${taskList(db.tasks.filter(t=>t.date===day))}</div><h2>今後の予定</h2>${taskList(db.tasks.filter(t=>t.date>day).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,30),true)}`;$('posts').innerHTML=`<div class="row"><h2>投稿ストック</h2><button class="tiny" onclick="postForm()">＋追加</button></div>${db.posts.length?db.posts.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(p=>`<div class="card"><div class="row"><strong>${esc(p.title||'無題')}</strong><span class="pill">${esc(p.status)}</span></div><small>${esc(accountName(p.account))} ・ ${esc(p.platform||'')}</small><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.body)}</p><div class="actions"><button class="tiny secondary" onclick="copyPost('${p.id}')">コピー</button><button class="tiny secondary" onclick="postForm('${p.id}')">編集</button><button class="tiny danger" onclick="removePost('${p.id}')">削除</button></div></div>`).join(''):'<div class="card empty">投稿を保存するとここに表示されます</div>'}`;$('analytics').innerHTML=`<h2>分析（第2段階で拡張）</h2><div class="card"><strong>タスク実行率</strong><h1>${todayTasks.length?Math.round(completed/todayTasks.length*100):0}%</h1><small>今日の完了 ${completed} / 全 ${todayTasks.length} 件</small></div><div class="card"><strong>投稿ストック</strong><h1>${db.posts.length} 件</h1><small>下書き・投稿予定・投稿済み</small></div><p class="notice">表示回数・いいね・クリック等の記録とグラフは第2段階で実装予定です。</p>`;$('money').innerHTML='<h2>収益管理（第3段階）</h2><div class="card"><p>楽天・Amazon・noteなどの収益を記録する画面を追加予定です。</p><small>このバージョンでは収益の入力・保存機能はありません。</small></div>'}function taskList(tasks,dates=false){if(!tasks.length)return '<div class="card empty">予定はありません</div>';return tasks.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(t=>`<div class="card ${t.status==='done'?'taskdone':''}"><div class="row"><input class="check" type="checkbox" aria-label="完了" style="flex:none" ${t.status==='done'?'checked':''} onchange="setStatus('${t.id}',this.checked?'done':'pending')"><div style="flex:1;min-width:0"><div class="tasktitle"><strong>${esc(t.title)}</strong></div><small>${dates?esc(fmt(t.date))+' ・ ':''}${esc(t.time||'時刻なし')} ・ ${esc(accountName(t.account))}</small></div><span class="pill">${({pending:'未完了',done:'完了',skip:'見送り'})[t.status]||'未完了'}</span></div><div class="actions"><button class="tiny secondary" onclick="taskForm('${t.id}')">編集・振替</button><button class="tiny secondary" onclick="setStatus('${t.id}','skip')">見送り</button><button class="tiny danger" onclick="removeTask('${t.id}')">削除</button></div></div>`).join('')}function setStatus(id,status){let t=db.tasks.find(x=>x.id===id);if(t){t.status=status;save();render()}}function taskForm(id){let t=db.tasks.find(x=>x.id===id)||{title:'',account:db.accounts[0]?.id,date:day,time:'20:00',status:'pending',notes:''};if(!db.accounts.length)return toast('先にアカウントを登録してください');openModal(`<h2>${id?'タスク編集':'タスク追加'}</h2><form id="taskform"><label>タスク名</label><input name="title" required maxlength="120" value="${esc(t.title)}"><label>アカウント</label><select name="account">${options(t.account)}</select><label>日付</label><input name="date" type="date" required value="${esc(t.date)}"><label>時刻</label><input name="time" type="time" value="${esc(t.time)}"><label>状態</label><select name="status">${[['pending','未完了'],['done','完了'],['skip','見送り']].map(([v,n])=>`<option value="${v}" ${t.status===v?'selected':''}>${n}</option>`).join('')}</select><label>メモ</label><textarea name="notes">${esc(t.notes||'')}</textarea><div class="actions"><button type="submit">保存</button><button type="button" class="secondary" onclick="closeModal()">キャンセル</button></div></form>`);$('taskform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries());if(id)Object.assign(t,data);else db.tasks.push({id:uid(),...data});save();closeModal();render();toast('保存しました')}}function removeTask(id){if(confirm('このタスクを削除しますか？')){db.tasks=db.tasks.filter(t=>t.id!==id);save();render()}}function accountForm(id){let a=account(id)||{name:'',platform:'Threads',color:'#6677ee'};openModal(`<h2>${id?'アカウント編集':'アカウント追加'}</h2><form id="accountform"><label>アカウント名</label><input name="name" maxlength="60" required value="${esc(a.name)}"><label>管理するSNS</label><input name="platform" maxlength="160" value="${esc(a.platform)}"><label>テーマカラー</label><input name="color" type="color" value="${esc(a.color)}"><div class="actions"><button>保存</button><button type="button" class="secondary" onclick="closeModal()">キャンセル</button>${id?`<button type="button" class="danger" onclick="removeAccount('${id}')">削除</button>`:''}</div></form>`);$('accountform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(id)Object.assign(a,data);else db.accounts.push({id:uid(),...data});save();closeModal();render()}}function removeAccount(id){if(!confirm('アカウントを削除しますか？関連タスク・投稿は残りますが「削除済み」と表示されます。'))return;db.accounts=db.accounts.filter(a=>a.id!==id);save();closeModal();render()}function postForm(id){let p=db.posts.find(x=>x.id===id)||{account:db.accounts[0]?.id,title:'',platform:'Threads',status:'下書き',body:'',created:new Date().toISOString()};if(!db.accounts.length)return toast('先にアカウントを登録してください');openModal(`<h2>${id?'投稿編集':'投稿追加'}</h2><form id="postform"><label>タイトル</label><input name="title" maxlength="120" required value="${esc(p.title)}"><label>アカウント</label><select name="account">${options(p.account)}</select><label>SNS</label><input name="platform" value="${esc(p.platform)}"><label>状態</label><select name="status">${['アイデア','下書き','投稿予定','投稿済み'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select><label>投稿本文</label><textarea name="body" rows="8">${esc(p.body)}</textarea><div class="actions"><button>保存</button><button type="button" class="secondary" onclick="closeModal()">キャンセル</button></div></form>`);$('postform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(id)Object.assign(p,data);else db.posts.push({id:uid(),created:new Date().toISOString(),...data});save();closeModal();render()}}function removePost(id){if(confirm('この投稿を削除しますか？')){db.posts=db.posts.filter(p=>p.id!==id);save();render()}}async function copyPost(id){let p=db.posts.find(x=>x.id===id);try{await navigator.clipboard.writeText(p.body);toast('本文をコピーしました')}catch{toast('コピーできませんでした。本文を選択してください')}}function downloadBackup(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sns-hub-backup-'+day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function openSettings(){openModal(`<h2>設定・バックアップ</h2><p class="notice">このアプリはログイン不要・端末内保存です。Safariのデータ削除などで消える場合があります。</p><div class="stack"><button onclick="downloadBackup()">バックアップを書き出す（JSON）</button><label>バックアップを復元（現在のデータは置き換え）</label><input id="restore" type="file" accept="application/json,.json"><button class="secondary" onclick="restoreBackup()">復元する</button><button class="secondary" onclick="closeModal()">閉じる</button></div>`)}async function restoreBackup(){let file=$('restore').files[0];if(!file)return toast('ファイルを選択してください');try{let obj=JSON.parse(await file.text()),d=obj.data;if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.tasks)||!Array.isArray(d.posts))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容に置き換えますか？'))return;db=d;save();closeModal();render();toast('復元しました')}catch{alert('対応していないバックアップ形式です')}}
// v2.1: extension state, stored separately so existing v1 data is never overwritten by migration.
const V2KEY='snshub-v2-1-extra';let extra;try{extra=JSON.parse(localStorage.getItem(V2KEY))||{}}catch{extra={}};
extra.rules ||= [];extra.engagement ||= {};extra.imports ||= [];extra.filter ||= 'all';
function saveExtra(){try{localStorage.setItem(V2KEY,JSON.stringify(extra))}catch{alert('追加設定を保存できませんでした')}}
const isoLocal=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const isValidDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime());
function generateDay(date){if(!isValidDate(date))return 0;let added=0;for(const r of extra.rules){if(r.enabled===false||date<r.start||r.end&&date>r.end)continue;let weekday=new Date(date+'T12:00:00').getDay();if(r.days!=='daily'&&!r.days.split(',').includes(String(weekday)))continue;let key='rule:'+r.id+':'+date;if(db.tasks.some(t=>t.ruleKey===key))continue;db.tasks.push({id:uid(),ruleKey:key,title:r.title,account:r.account,date,time:r.time,status:'pending',notes:'繰り返し予定から生成'});added++}if(added)save();return added}
function generateRange(){let today=isoLocal(),n=0;for(let i=0;i<15;i++){let d=new Date(today+'T12:00:00');d.setDate(d.getDate()+i);n+=generateDay(isoLocal(d))}return n}
const originalRender=render;
render=function(){originalRender();let a=$('home');if(!a)return;let before=a.innerHTML;let filters='<div class="filterbar"><button class="tiny '+(extra.filter==='all'?'chosen':'secondary')+'" onclick="setFilter(\'all\')">すべて</button>'+db.accounts.map(x=>'<button class="tiny '+(extra.filter===x.id?'chosen':'secondary')+'" onclick="setFilter(\''+x.id+'\')">'+esc(x.name)+'</button>').join('')+'</div>';
let tasks=db.tasks.filter(t=>t.date===isoLocal()&&(extra.filter==='all'||t.account===extra.filter));let pending=tasks.filter(t=>t.status==='pending').sort((x,y)=>(x.time||'').localeCompare(y.time||''));let next=pending[0];let quick='<div class="card"><div class="row"><strong>次にやること</strong><button class="tiny secondary" onclick="show(\'schedule\')">予定を見る</button></div><p>'+(next?esc((next.time||'--:--')+'　'+accountName(next.account)+'　'+next.title):'未完了の予定はありません')+'</p><div class="actions"><button class="tiny" onclick="importForm()">ChatGPT取り込み</button><button class="tiny secondary" onclick="ruleForm()">繰り返し設定</button><button class="tiny secondary" onclick="exportProgress()">進捗を出力</button></div></div>';
let engage='<div class="row"><h2>交流カウンター</h2><small>日付別に保存</small></div>'+db.accounts.filter(x=>extra.filter==='all'||x.id===extra.filter).map(x=>{let k=isoLocal()+'|'+x.id,v=extra.engagement[k]||{reply:0,like:0};return '<div class="card"><strong>'+esc(x.name)+'</strong><div class="row topgap"><span>返信</span><div class="counter"><button class="tiny secondary" onclick="changeCount(\''+x.id+'\',\'reply\',-1)">−</button><strong>'+v.reply+'</strong><button class="tiny" onclick="changeCount(\''+x.id+'\',\'reply\',1)">＋</button></div></div><div class="row topgap"><span>いいね</span><div class="counter"><button class="tiny secondary" onclick="changeCount(\''+x.id+'\',\'like\',-1)">−</button><strong>'+v.like+'</strong><button class="tiny" onclick="changeCount(\''+x.id+'\',\'like\',1)">＋</button></div></div></div>'}).join('');
// Keep existing account editor and overview, replace only task cards for filtered view.
let oldStart=before.indexOf('<div class="row"><h2>今日のタスク</h2>'),oldEnd=before.indexOf('<h2>アカウント</h2>');if(oldStart>=0&&oldEnd>oldStart){before=before.slice(0,oldStart)+filters+quick+'<div class="row"><h2>今日のタスク</h2><button class="tiny" onclick="taskForm()">＋追加</button></div>'+taskList(tasks)+engage+before.slice(oldEnd)}a.innerHTML=before;
$('schedule').insertAdjacentHTML('afterbegin','<div class="actions"><button class="tiny" onclick="ruleForm()">＋繰り返しルール</button><button class="tiny secondary" onclick="generateNow()">今後14日分を生成</button></div>');
$('posts').insertAdjacentHTML('afterbegin','<div class="actions"><button class="tiny" onclick="importForm()">＋ ChatGPTから一括取り込み</button><button class="tiny secondary" onclick="exportProgress()">分析用に出力</button></div>');
};
function setFilter(id){extra.filter=id;saveExtra();render()}
function changeCount(id,type,delta){let k=isoLocal()+'|'+id,v=extra.engagement[k]||{reply:0,like:0};v[type]=Math.max(0,(Number(v[type])||0)+delta);extra.engagement[k]=v;saveExtra();render()}
function generateNow(){let n=generateRange();render();toast(n+'件の予定を生成しました')}
function ruleForm(id){let r=extra.rules.find(x=>x.id===id)||{title:'',account:db.accounts[0]?.id,time:'07:00',days:'daily',start:isoLocal(),end:'',enabled:true};openModal('<h2>繰り返し予定 '+(id?'編集':'追加')+'</h2><form id="ruleform"><label>タスク名</label><input required name="title" maxlength="120" value="'+esc(r.title)+'"><label>アカウント</label><select name="account">'+options(r.account)+'</select><label>時刻</label><input name="time" type="time" value="'+esc(r.time)+'"><label>繰り返し</label><select name="days"><option value="daily" '+(r.days==='daily'?'selected':'')+'>毎日</option><option value="1,2,3,4,5" '+(r.days==='1,2,3,4,5'?'selected':'')+'>平日</option><option value="0,6" '+(r.days==='0,6'?'selected':'')+'>土日</option>'+[0,1,2,3,4,5,6].map((n)=>'<option value="'+n+'" '+(r.days===String(n)?'selected':'')+'>'+['日','月','火','水','木','金','土'][n]+'曜日</option>').join('')+'</select><label>開始日</label><input name="start" type="date" required value="'+esc(r.start)+'"><label>終了日（任意）</label><input name="end" type="date" value="'+esc(r.end)+'"><div class="actions"><button>保存して予定生成</button><button type="button" class="secondary" onclick="closeModal()">閉じる</button>'+(id?'<button type="button" class="danger" onclick="deleteRule(\''+id+'\')">ルール削除</button>':'')+'</div></form><h2>登録済みルール</h2>'+extra.rules.map(x=>'<div class="row card"><div><strong>'+esc(x.title)+'</strong><br><small>'+esc(accountName(x.account))+' '+esc(x.time)+'</small></div><button class="tiny secondary" type="button" onclick="ruleForm(\''+x.id+'\')">編集</button></div>').join(''));$('ruleform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());if(id)Object.assign(r,d);else extra.rules.push({id:uid(),...d,enabled:true});saveExtra();generateRange();closeModal();render();toast('繰り返し予定を保存しました')}}
function deleteRule(id){if(!confirm('ルールを削除しますか？生成済みタスクは残ります。'))return;extra.rules=extra.rules.filter(x=>x.id!==id);saveExtra();closeModal();render()}
function validateImport(raw){let obj=JSON.parse(raw);if(!obj||typeof obj!=='object'||!Array.isArray(obj.tasks)&&!Array.isArray(obj.posts))throw Error('tasks または posts の配列が必要です');let tasks=(obj.tasks||[]).map(t=>{if(!t||typeof t.title!=='string'||!isValidDate(t.date)||!t.account)throw Error('タスクに title/date/account が必要です');let a=db.accounts.find(a=>a.id===t.account||a.name===t.account);if(!a)throw Error('未登録アカウント: '+t.account);if(t.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time))throw Error('時刻は HH:MM で指定');return {title:t.title.slice(0,120),date:t.date,account:a.id,time:t.time||'',status:'pending',notes:String(t.notes||'').slice(0,1000)}});let posts=(obj.posts||[]).map(p=>{if(!p||typeof p.body!=='string'||!p.account)throw Error('投稿に body/account が必要です');let a=db.accounts.find(a=>a.id===p.account||a.name===p.account);if(!a)throw Error('未登録アカウント: '+p.account);return {title:String(p.title||'投稿').slice(0,120),account:a.id,platform:String(p.platform||'Threads').slice(0,80),body:p.body.slice(0,10000),status:'下書き'}});if(tasks.length+posts.length>300)throw Error('1回の取り込みは300件まで');return {tasks,posts}}
let staged=null;
function importForm(){staged=null;openModal('<h2>ChatGPTから一括取り込み</h2><p class="notice">ChatGPTに「SNS HUB取り込み用JSONで今日のタスクと投稿を出して」と頼み、内容を貼り付けます。自動同期ではありません。</p><button class="tiny secondary" onclick="copyImportPrompt()">ChatGPTへの依頼文をコピー</button><label>JSONテキスト</label><textarea id="importtext" rows="10" placeholder=\'{"tasks":[{"account":"ラクノバ","date":"2026-11-16","time":"07:00","title":"朝の投稿"}],"posts":[]}\'></textarea><label>またはJSONファイル</label><input type="file" id="importfile" accept=".json,application/json"><div class="actions"><button onclick="previewImport()">内容を確認</button><button class="secondary" onclick="closeModal()">閉じる</button></div><div id="importpreview"></div>')}
function copyImportPrompt(){let prompt='SNS HUB v2.1に取り込むため、次のJSON形式だけをコードブロックなしで出力して。アカウント名は ラクノバ、よし、NOVELCA、からだ日和50＋、NEXARIA のいずれか。日付はYYYY-MM-DD、時刻はHH:MM。形式: {"tasks":[{"account":"ラクノバ","date":"'+isoLocal()+'","time":"07:00","title":"朝の投稿","notes":""}],"posts":[{"account":"ラクノバ","title":"朝の投稿","platform":"Threads","body":"投稿本文"}]}。既に決まっている予定と投稿だけを含め、未確定の内容は作らないで。';navigator.clipboard.writeText(prompt).then(()=>toast('依頼文をコピーしました')).catch(()=>toast('コピーできませんでした'))}
async function previewImport(){try{let raw=$('importtext').value.trim();if($('importfile').files[0])raw=await $('importfile').files[0].text();raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');staged=validateImport(raw);let freshT=staged.tasks.filter(t=>!db.tasks.some(x=>x.account===t.account&&x.date===t.date&&x.time===t.time&&x.title===t.title));let freshP=staged.posts.filter(p=>!db.posts.some(x=>x.account===p.account&&x.title===p.title&&x.body===p.body));staged={tasks:freshT,posts:freshP};$('importpreview').innerHTML='<p class="notice">追加予定: タスク '+freshT.length+'件 / 投稿 '+freshP.length+'件（重複は除外）</p><div class="preview">'+esc([...freshT.map(x=>x.date+' '+x.time+' '+accountName(x.account)+' '+x.title),...freshP.map(x=>'投稿 '+accountName(x.account)+' '+x.title)].join('\n')||'追加するデータはありません')+'</div><button class="wide topgap" onclick="commitImport()" '+(!freshT.length&&!freshP.length?'disabled':'')+'>確認した内容を登録</button>'}catch(e){staged=null;toast('取り込みエラー');$('importpreview').textContent='エラー: '+e.message}}
function commitImport(){if(!staged)return;let n=staged.tasks.length+staged.posts.length;db.tasks.push(...staged.tasks.map(t=>({id:uid(),...t})));db.posts.push(...staged.posts.map(p=>({id:uid(),created:new Date().toISOString(),...p})));save();closeModal();render();toast(n+'件を登録しました');staged=null}
function downloadJSON(obj,name){let u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function exportProgress(){downloadJSON({format:'sns-hub-progress-v2.1',date:isoLocal(),accounts:db.accounts.map(a=>({id:a.id,name:a.name})),tasks:db.tasks.filter(t=>t.date>=isoLocal()).map(t=>({account:accountName(t.account),date:t.date,time:t.time,title:t.title,status:t.status})),engagement:extra.engagement,posts:db.posts.map(p=>({account:accountName(p.account),title:p.title,status:p.status,body:p.body}))},'sns-hub-progress-'+isoLocal()+'.json');toast('進捗ファイルを書き出しました')}
const originalSettings=openSettings;
openSettings=function(){originalSettings();$('modalbody').insertAdjacentHTML('beforeend','<hr><h2>v2.1 追加データ</h2><p class="notice">繰り返しルールと交流カウンターは別ファイルで保存されます。両方のバックアップを保管してください。</p><button class="secondary wide" onclick="downloadJSON({version:2,extra:extra},\'sns-hub-v2-extra-'+isoLocal()+'.json\')">追加設定のバックアップ</button><label>追加設定を復元</label><input id="extraRestore" type="file" accept=".json,application/json"><button class="secondary wide topgap" onclick="restoreExtra()">追加設定を復元</button>')};
async function restoreExtra(){try{let f=$('extraRestore').files[0];if(!f)return toast('ファイルを選択してください');let d=JSON.parse(await f.text());if(!d.extra||!Array.isArray(d.extra.rules)||typeof d.extra.engagement!=='object')throw Error('形式が違います');if(!confirm('繰り返しルールと交流カウンターを置き換えますか？'))return;extra=d.extra;saveExtra();closeModal();render();toast('追加設定を復元しました')}catch(e){alert('復元できません: '+e.message)}}
// Generate the next 14 days when app starts, without duplicating existing generated tasks.
day=isoLocal();generateRange();
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
